server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # OPEN AUTH ENDPOINTS
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**

            # SECURED USER ENDPOINTS
            - id: user-service-secured
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - Authentication

            # VEHICLE SERVICE
            - id: vehicle-service
              uri: lb://VEHICLE-SERVICE
              predicates:
                - Path=/api/vehicles/**
              filters:
                - Authentication

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    prometheus:
      enabled: true